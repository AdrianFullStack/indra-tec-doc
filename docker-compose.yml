services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    container_name: api-techdoc
    ports:
      - '${APP_PORT}:${APP_PORT}'
    environment:
      DB_HOST: db-techdoc
      DATABASE_URL: postgres://postgres:postgres@db-techdoc:5432/techdoc_db
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres

  postgres:
    image: postgres
    restart: always
    container_name: db-techdoc
    ports:
      - "${DB_PORT}:${DB_PORT}"
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_SCHEMA: ${DB_SCHEMA}
    volumes:
      - ./volumenes/postgres:/var/lib/postgresql

volumes:
  postgres_data:
  node_modules: